<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios | FinanControl</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="layout">
    <aside class="menu-lateral" id="menu-lateral"></aside>

    <div class="conteudo">
      <header class="barra-topo">
        <div>
          <h1>Relatórios</h1>
          <p class="contexto" id="contexto">Carregando...</p>
        </div>
        <div class="acoes-topo">
          <label class="botao botao-contorno" for="mes" style="gap:7px">
            <svg class="icone icone-p" viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>
            </svg>
            <input type="month" id="mes" style="border:0;outline:0;font:inherit;font-weight:600;background:transparent">
          </label>
          <button class="botao botao-contorno" id="btn-exportar">
            <svg class="icone icone-p" viewBox="0 0 24 24">
              <path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
            </svg>
            Exportar CSV
          </button>
        </div>
      </header>

      <main class="corpo">
        <div style="display:grid;grid-template-columns:1.55fr 1fr;gap:14px" class="grade-relatorio">

          <!-- ------------------------- receitas x despesas por mês -->
          <section class="cartao" style="padding:16px 18px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
              <div>
                <div class="cartao-titulo">Receitas x Despesas</div>
                <div class="cartao-desc">Comparativo dos últimos 6 meses</div>
              </div>
              <div style="display:flex;gap:14px;font-size:11.5px;color:var(--texto-suave)">
                <span style="display:flex;align-items:center;gap:5px">
                  <i style="width:8px;height:8px;border-radius:50%;background:#16a34a;display:block"></i>Receitas</span>
                <span style="display:flex;align-items:center;gap:5px">
                  <i style="width:8px;height:8px;border-radius:50%;background:#a1a1aa;display:block"></i>Despesas</span>
              </div>
            </div>
            <svg viewBox="0 0 660 260" style="width:100%;height:262px;margin-top:14px" id="grafico-barras"></svg>
          </section>

          <!-- --------------------------------- despesas por categoria -->
          <section class="cartao" style="padding:16px 18px">
            <div class="cartao-titulo">Despesas por categoria</div>
            <div class="cartao-desc" id="desc-categoria">--</div>
            <div style="display:flex;align-items:center;gap:18px;margin-top:12px;flex-wrap:wrap">
              <svg viewBox="0 0 120 120" style="width:132px;height:132px;flex:none" id="rosca"></svg>
              <div style="flex:1;min-width:140px;display:flex;flex-direction:column;gap:9px;font-size:12.5px"
                   id="legenda-categoria"></div>
            </div>
          </section>
        </div>

        <!-- ----------------------------------------- resumo detalhado -->
        <section class="cartao" style="margin-top:14px">
          <div class="cartao-topo" style="padding-bottom:12px">
            <div>
              <div class="cartao-titulo">Resumo por categoria</div>
              <div class="cartao-desc" id="desc-resumo">--</div>
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th style="width:32%">Categoria</th>
                <th>Lançamentos</th>
                <th style="width:28%">Participação</th>
                <th style="text-align:right">Total no mês</th>
                <th style="text-align:right">Mês anterior</th>
              </tr>
            </thead>
            <tbody id="tabela-categorias"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/relatorios.js"></script>
</body>
</html>
